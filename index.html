<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BarkerBox - Subscribe and Save 15%</title>
  <!-- Connects this HTML file to your CSS styling file -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- White card container that holds the image, text, and form -->
  <div class="form-container">
    <!-- Circular featured dog image at the top -->
    <img class="featured-img" src="dog.jpg" alt="Illustration of a happy dog." />

    <!-- Centered main heading -->
    <h1>BarkerBox - Subscribe and Save 15%</h1>

    <!-- Left-aligned product description paragraph -->
    <p>
      Discover a monthly subscription box that brings an assortment of unique, playful, and durable toys that dogs will love. Subscribe now and enjoy exclusive benefits!
    </p>

    <!-- Registration form with name and email inputs -->
    <form>
      <input type="text" placeholder="Enter your name" required />
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Get My 15% Off</button>
    </form>
  </div>

</body>
</html>
